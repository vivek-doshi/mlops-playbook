version: 1
updated: 2026-05-30
workflow_to_files:
  kubernetes_microservice:
    entrypoints:
      - docs/golden-paths/kubernetes-microservice.md
      - docs/ARCHITECTURE_DECISION_GUIDE.md
    implementation:
      - docker/
      - ci/
      - terraform/aws-eks/
      - terraform/azure-aks/
      - terraform/gcp-gke/
      - cd/targets/aws-eks/
      - cd/targets/azure-aks/
      - cd/targets/gcp-gke/
      - cd/kubernetes/
      - cd/helm/
    guardrails:
      - security/
      - policy/
      - finops/policies/
  serverless_app:
    entrypoints:
      - docs/golden-paths/serverless-app.md
      - docs/ARCHITECTURE_DECISION_GUIDE.md
    implementation:
      - ci/
      - terraform/aws-lambda/
      - cd/targets/aws-lambda/
    guardrails:
      - security/secret-detection/
      - security/dependency-audit/
  frontend_spa:
    entrypoints:
      - docs/golden-paths/frontend-spa.md
      - docs/ARCHITECTURE_DECISION_GUIDE.md
      - website/src/App.tsx
      - website/src/components/Header.tsx
      - website/src/components/Sidebar.tsx
      - website/src/components/CodeViewer.tsx
      - docs/guides/concepts.md
      - website/index.html
      - website/public/robots.txt
      - website/public/sitemap.xml
    implementation:
      - docker/react/
      - docker/angular/
      - ci/github-actions/react/
      - ci/github-actions/angular/
      - cd/targets/azure-app-service/
      - website/
    guardrails:
      - security/
      - observability/
  data_pipeline:
    entrypoints:
      - docs/golden-paths/data-pipeline.md
    implementation:
      - ci/
      - cd/kubernetes/
      - terraform/
    guardrails:
      - security/
      - finops/
  incident_response:
    entrypoints:
      - docs/golden-paths/incident-response.md
      - secops/runbooks/
    implementation:
      - secops/runbooks/compromised-pod.md
      - secops/runbooks/node-compromise.md
      - secops/runbooks/secret-exposure.md
      - secops/runbooks/supply-chain-incident.md
      - observability/
      - notifications/
    guardrails:
      - secops/
      - policy/
  platform_onboarding:
    entrypoints:
      - docs/golden-paths/platform-onboarding.md
    implementation:
      - local-dev/
      - ci/
      - cd/
      - terraform/
      - security/

  # -------------------------------------------------------------------------
  # MLOps Workflows
  # -------------------------------------------------------------------------

  mlops_experiment:
    description: "Log and track an ML experiment with MLflow and DVC"
    entrypoints:
      - docs/golden-paths/experiment-tracking.md
      - GETTING_STARTED.md
    implementation:
      - mlflow/tracking-server/docker-compose.yml
      - dvc/pipeline-templates/train-eval-deploy.yaml
      - ci/github-actions/model-training/train.yml
    guardrails:
      - policy/data-governance/README.md
      - ci/github-actions/_shared/reusable-mlops-scan.yml

  mlops_model_promotion:
    description: "Promote a trained model through Staging to Production"
    entrypoints:
      - docs/golden-paths/model-registry.md
      - policy/model-approval/README.md
    implementation:
      - ci/github-actions/model-evaluation/evaluate.yml
      - policy/model-approval/approved-versions.yaml
      - monitoring/evidently/drift_report.py
    guardrails:
      - policy/model-approval/README.md
      - policy/data-governance/pii-model-checklist.md

  mlops_serving:
    description: "Deploy a model to a serving runtime (Triton, TorchServe, vLLM)"
    entrypoints:
      - docs/golden-paths/model-serving.md
      - serving/README.md
    implementation:
      - serving/triton/
      - serving/torchserve/
      - serving/vllm/
      - ci/github-actions/model-deployment/deploy.yml
      - terraform/gpu-cluster/main.tf
    guardrails:
      - docs/guides/gpu-cost-governance.md
      - policy/model-approval/README.md

  mlops_monitoring:
    description: "Monitor production model for data drift and accuracy degradation"
    entrypoints:
      - docs/golden-paths/model-monitoring.md
      - monitoring/README.md
    implementation:
      - monitoring/evidently/drift_report.py
      - monitoring/alerts/drift-alerts.yaml
      - monitoring/dashboards/model-health.json
      - ci/github-actions/model-monitoring/drift-check.yml
    guardrails:
      - policy/model-approval/README.md
      - observability/
      - finops/

  mlops_local_setup:
    description: "Set up local dev environment with GPU passthrough and Dev Container"
    entrypoints:
      - docs/local-setup.md
      - GETTING_STARTED.md
    implementation:
      - .devcontainer/devcontainer.json
      - scripts/bootstrap.sh
      - scripts/bootstrap.ps1
      - serving/vllm/docker-compose.yml
      - mlflow/tracking-server/docker-compose.yml
    guardrails:
      - .pre-commit-config.yaml
      - Taskfile.yml

  mlops_adr_review:
    description: "Review or create architecture decision records for the ML platform"
    entrypoints:
      - docs/decisions/
    implementation:
      - docs/decisions/ADR-ML-001-experiment-tracking.md
      - docs/decisions/ADR-ML-002-data-versioning.md
      - docs/decisions/ADR-ML-003-model-serving.md
      - docs/decisions/ADR-ML-004-drift-monitoring.md
      - docs/decisions/ADR-ML-005-ci-cd-platform.md
      - docs/decisions/ADR-ML-006-infrastructure-terraform.md
      - docs/decisions/ADR-ML-007-dev-container.md
      - docs/decisions/ADR-ML-008-model-approval-policy.md
      - docs/decisions/ADR-ML-009-pre-commit-toolchain.md
    guardrails:
      - .ai/context/repo-summary.md
    guardrails:
      - policy/
      - secops/
