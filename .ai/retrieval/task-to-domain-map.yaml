version: 2
updated: 2026-08-31
defaults:
  start_with:
    - README.md
    - docs/golden-paths/mlops-workflow.md
  guardrails:
    - policy/
    - finops/
task_to_domain:
  setup_ci_pipeline:
    domains: [ci, policy, security-scan]
    paths:
      - ci/github-actions/
      - ci/github-actions/_shared/
      - policy/
  deploy_application:
    domains: [cd, terraform, kubernetes]
    paths:
      - cd/kubernetes/
      - terraform/
      - serving/
  kubernetes_workload:
    domains: [cd-kubernetes, argo, policy]
    paths:
      - cd/kubernetes/
      - cd/argo/
      - policy/
  infrastructure_provisioning:
    domains: [terraform]
    paths:
      - terraform/
  security_hardening:
    domains: [security-scan, policy, data-governance]
    paths:
      - ci/github-actions/_shared/reusable-mlops-scan.yml
      - policy/
  incident_response:
    domains: [docs-runbooks, monitoring, external-platform]
    paths:
      - docs/runbooks/
      - monitoring/
      - devops-playbook/notifications/ # external dependency
  observability_setup:
    domains: [monitoring, external-platform]
    paths:
      - monitoring/
      - devops-playbook/observability/ # external dependency
  finops_governance:
    domains: [finops, policy, ci]
    paths:
      - finops/
      - policy/
      - ci/github-actions/
  documentation_or_decision_support:
    domains: [docs, runbooks]
    paths:
      - docs/
      - docs/golden-paths/
      - docs/decisions/
