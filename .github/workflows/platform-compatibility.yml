name: Platform Compatibility Check

on:
  schedule:
    - cron: '0 0 1 * *'  # Monthly on the 1st
  pull_request:
    branches: [main, develop]

jobs:
  check-platform-manifest:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download platform manifest
        run: |
          echo "Downloading platform manifest from devops-playbook..."
          gh repo clone vivek-doshi/devops-playbook -- --depth 1

      - name: Validate platform version
        run: |
          manifest="devops-playbook/manifest.yaml"

          if [ ! -f "$manifest" ]; then
            echo "::warning::Platform manifest not found at $manifest — devops-playbook has not published one yet. Skipping compatibility checks."
            exit 0
          fi

          echo "Validating platform version compatibility..."

          platform_version=$(grep '^  version:' "$manifest" | awk '{print $2}' | tr -d '"')
          min_version=$(grep 'min-platform-version:' "$manifest" | awk '{print $2}' | tr -d '"')

          if [ "$(printf '%s\n%s' "$platform_version" "$min_version" | sort -V | head -n1)" != "$min_version" ]; then
            echo "❌ Platform version $platform_version is incompatible (minimum: $min_version)"
            exit 1
          else
            echo "✓ Platform version $platform_version is compatible"
          fi

      - name: Check required features
        run: |
          manifest="devops-playbook/manifest.yaml"
          [ -f "$manifest" ] || { echo "::warning::Platform manifest not found, skipping."; exit 0; }

          echo "Checking required features..."

          # Verify all required features are present
          required_features=$(awk '/required-features:/{flag=1; next} /^[a-zA-Z]/{flag=0} flag' "$manifest" | sed 's/^ *- *//')

          for feature in $required_features; do
            if ! grep -q "$feature" "$manifest"; then
              echo "❌ Missing required feature: $feature"
              exit 1
            else
              echo "✓ Required feature present: $feature"
            fi
          done

      - name: Validate component compatibility
        run: |
          manifest="devops-playbook/manifest.yaml"
          [ -f "$manifest" ] || { echo "::warning::Platform manifest not found, skipping."; exit 0; }

          echo "Validating component compatibility..."

          components=(
            "gpu-cluster"
            "base-kubernetes"
            "secrets-management"
            "oidc-federation"
            "policy-controls"
            "observability-baseline"
          )

          min_version=$(grep 'min-platform-version:' "$manifest" | awk '{print $2}' | tr -d '"')

          for component in "${components[@]}"; do
            component_version=$(awk "/$component:/{f=1;next} f && /version:/{print \$2; exit}" "$manifest" | tr -d '"')

            if [ "$(printf '%s\n%s' "$component_version" "$min_version" | sort -V | head -n1)" != "$min_version" ]; then
              echo "❌ Component $component version $component_version is incompatible (minimum: $min_version)"
              exit 1
            else
              echo "✓ Component $component version $component_version is compatible"
            fi
          done

