name: Validate Intelligence Paths

on:
  schedule:
    - cron: '0 0 1 * *'  # Monthly on the 1st
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  validate-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check context path references
        run: |
          echo "Checking context path references..."
          find .ai/context -name "*.md" -exec grep -l "\./\|/\|\.\./" {} \; | while read file; do
            echo "  - $file"
          done
      
      - name: Check retrieval path references
        run: |
          echo "Checking retrieval path references..."
          find .ai/retrieval -name "*.md" -exec grep -l "\./\|/\|\.\./" {} \; | while read file; do
            echo "  - $file"
          done
      
      - name: Check instructions path references
        run: |
          echo "Checking instructions path references..."
          find .ai/instructions -name "*.md" -exec grep -l "\./\|/\|\.\./" {} \; | while read file; do
            echo "  - $file"
          done
      
      - name: Validate all paths exist
        run: |
          echo "Validating all referenced paths exist..."
          
          # Extract all unique paths from context files
          context_paths=$(grep -oP ':[^:]+\.md' .ai/context/*.md | sort -u)
          
          # Extract all unique paths from retrieval files
          retrieval_paths=$(grep -oP ':[^:]+\.md' .ai/retrieval/*.md | sort -u)
          
          # Extract all unique paths from instructions files
          instructions_paths=$(grep -oP ':[^:]+\.md' .ai/instructions/*.md | sort -u)
          
          # Combine and validate
          all_paths=$(echo "$context_paths
$retrieval_paths
$instructions_paths" | sort -u)
          
          for path in $all_paths; do
            if [ -n "$path" ]; then
              if [ ! -f "$path" ]; then
                echo "❌ Missing path: $path"
              else
                echo "✓ Valid path: $path"
              fi
            fi
          done
