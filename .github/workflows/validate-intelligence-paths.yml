name: Validate Intelligence Paths

on:
  schedule:
    - cron: '0 0 1 * *'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  validate-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate repository intelligence links and routes
        run: python scripts/validate-intelligence-paths.py
