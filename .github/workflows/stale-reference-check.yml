name: Stale Reference Check

on:
  schedule:
    - cron: '0 0 1 * *'  # Monthly on the 1st
  workflow_dispatch:

jobs:
  check-stale-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check context file freshness
        run: |
          echo "Checking context file freshness..."
          
          # Get last modified dates
          context_files=$(find .ai/context -name "*.md" -type f)
          
          for file in $context_files; do
            last_modified=$(git log -1 --format=%ct "$file")
            last_modified_date=$(date -d @$last_modified +"%Y-%m-%d")
            echo "  - $file: $last_modified_date"
          done
      
      - name: Check retrieval file freshness
        run: |
          echo "Checking retrieval file freshness..."
          
          # Get last modified dates
          retrieval_files=$(find .ai/retrieval -name "*.md" -type f)
          
          for file in $retrieval_files; do
            last_modified=$(git log -1 --format=%ct "$file")
            last_modified_date=$(date -d @$last_modified +"%Y-%m-%d")
            echo "  - $file: $last_modified_date"
          done
      
      - name: Check instructions file freshness
        run: |
          echo "Checking instructions file freshness..."
          
          # Get last modified dates
          instructions_files=$(find .ai/instructions -name "*.md" -type f)
          
          for file in $instructions_files; do
            last_modified=$(git log -1 --format=%ct "$file")
            last_modified_date=$(date -d @$last_modified +"%Y-%m-%d")
            echo "  - $file: $last_modified_date"
          done
      
      - name: Validate path references
        run: |
          echo "Validating path references..."
          
          # Extract all unique paths from context files
          context_paths=$(grep -oP '(?<=: )[^:]+(?=\.md)' .ai/context/*.md | sort -u)
          
          # Extract all unique paths from retrieval files
          retrieval_paths=$(grep -oP '(?<=: )[^:]+(?=\.md)' .ai/retrieval/*.md | sort -u)
          
          # Extract all unique paths from instructions files
          instructions_paths=$(grep -oP '(?<=: )[^:]+(?=\.md)' .ai/instructions/*.md | sort -u)
          
          # Combine and validate
          all_paths=$(echo "$context_paths
$retrieval_paths
$instructions_paths" | sort -u)
          
          stale_count=0
          
          for path in $all_paths; do
            if [ -n "$path" ]; then
              if [ ! -f "$path" ]; then
                echo "❌ Missing path: $path"
                stale_count=$((stale_count + 1))
              fi
            fi
          done
          
          if [ $stale_count -gt 0 ]; then
            echo "❌ Found $stale_count stale references"
            exit 1
          else
            echo "✓ All path references are valid"
          fi
      
      - name: Check for outdated metadata
        run: |
          echo "Checking for outdated metadata..."
          
          # Check if metadata is recent (last 30 days)
          metadata_age=$(find .ai/context -name "*.md" -type f -exec stat -c %Y {} \; | sort -rn | head -1)
          metadata_age_days=$(( ( $(date +%s) - $metadata_age ) / 86400 ))
          
          if [ $metadata_age_days -gt 30 ]; then
            echo "⚠️ Context files may be outdated (last modified: $metadata_age_days days ago)"
          else
            echo "✓ Context files are recent"
          fi
