# TorchServe Server Configuration
# Reference: https://pytorch.org/serve/configuration.html
#
# This file is read by TorchServe at startup.
# Mount it into the container at /home/model-server/config.properties
# or pass with: torchserve --ts-config /path/to/config.properties

# -----------------------------------------------------------------------
# NETWORK ADDRESSES
# Use 0.0.0.0 to accept connections from any interface.
# In Kubernetes, these ports are exposed via the Service manifest.
# -----------------------------------------------------------------------

# Inference API — receives prediction requests.
inference_address=http://0.0.0.0:8080

# Management API — register/unregister models, check model status.
management_address=http://0.0.0.0:8081

# Metrics API — exposes Prometheus-compatible metrics.
metrics_address=http://0.0.0.0:8082

# -----------------------------------------------------------------------
# WORKER THREADS
# number_of_netty_threads controls async I/O threads for network handling.
# Tune based on your server's CPU core count.
# A good starting point is 2x the number of CPU cores.
# -----------------------------------------------------------------------
number_of_netty_threads=4

# -----------------------------------------------------------------------
# REQUEST QUEUE
# job_queue_size sets the maximum number of pending requests before
# TorchServe starts rejecting with HTTP 503.
# Increase this if you see 503 errors under burst traffic.
# -----------------------------------------------------------------------
job_queue_size=100

# -----------------------------------------------------------------------
# MODEL STORE
# Directory where .mar (Model ARchive) files are stored.
# TorchServe monitors this directory for new models when load_models=all.
# In Docker/Kubernetes, mount your model store volume here.
# -----------------------------------------------------------------------
model_store=/home/model-server/model-store

# -----------------------------------------------------------------------
# MODEL LOADING
# "all"    = load every .mar file in model_store at startup (simplest)
# "none"   = start empty; load models via the Management API
# "model1" = load a specific model by name
# For production, prefer explicit model loading to avoid serving
# unintended model versions from the model store directory.
# -----------------------------------------------------------------------
load_models=all

# -----------------------------------------------------------------------
# WORKERS PER MODEL
# Each worker is a separate Python process. More workers = more throughput
# but more memory. Start with 1 and tune based on latency measurements.
# For GPU serving, workers should equal the number of GPUs allocated.
# -----------------------------------------------------------------------
default_workers_per_model=1

# -----------------------------------------------------------------------
# REQUEST TIMEOUT
# Maximum time in seconds to wait for a model to respond.
# Increase for large models with slow inference.
# -----------------------------------------------------------------------
default_response_timeout=120

# -----------------------------------------------------------------------
# ENABLE METRICS (PROMETHEUS)
# Set to true to expose /metrics endpoint on metrics_address.
# -----------------------------------------------------------------------
enable_metrics_api=true
metrics_format=prometheus
