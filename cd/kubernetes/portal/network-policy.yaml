apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mlops-portal-egress
  namespace: mlops-portal
spec:
  podSelector:
    matchLabels:
      app: mlops-portal
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
  egress:
    # GitHub API (api.github.com :443)
    - ports:
        - port: 443
          protocol: TCP
    # MLflow tracking server (in-cluster)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mlops-platform
      ports:
        - port: 5000
    # Kubernetes API server
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
