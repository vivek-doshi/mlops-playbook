# environments/dev/resource-quota.yaml
# Resource quota for the <model-name>-dev namespace.
# Limits: 2 CPU, 8Gi memory, 1 GPU max (per Phase 2 spec).

apiVersion: v1
kind: ResourceQuota
metadata:
  name: dev-quota
spec:
  hard:
    requests.cpu: "1"
    limits.cpu: "2"
    requests.memory: "4Gi"
    limits.memory: "8Gi"
    requests.nvidia.com/gpu: "1"
    limits.nvidia.com/gpu: "1"
    pods: "10"
    services: "5"
    persistentvolumeclaims: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: dev-limit-range
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "250m"
        memory: "256Mi"
      max:
        cpu: "2"
        memory: "4Gi"
    - type: Pod
      max:
        cpu: "2"
        memory: "8Gi"
