# environments/production/kustomization.yaml
# Kustomize overlay for the production environment.
# Requires manual approval from 2 members of @ml-approvers before deploy.
# No hard resource quota — governed by VPA recommendations.
#
# Namespace convention: <model-name>-prod

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../_base
  - pdb.yaml
  - network-policy.yaml

namespace: model-prod  # replaced by CI with <model-name>-prod

images:
  - name: model-serving
    newTag: production-latest

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: model-serving
      spec:
        replicas: 3
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 1
            maxSurge: 1
        template:
          metadata:
            labels:
              environment: production
          spec:
            containers:
              - name: model-server
                resources:
                  requests:
                    cpu: "1"
                    memory: "2Gi"
                  limits:
                    cpu: "4"
                    memory: "8Gi"
                env:
                  - name: ENVIRONMENT
                    value: production
                  - name: LOG_LEVEL
                    value: WARNING

commonLabels:
  environment: production
  tier: production
