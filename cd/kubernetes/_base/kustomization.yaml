# _base/kustomization.yaml
# Kustomize base — lists all base resources.
# Environment overlays reference this via their 'resources' or 'bases' field.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

# Common labels applied to all resources in the base.
commonLabels:
  managed-by: kustomize
  part-of: mlops-playbook
