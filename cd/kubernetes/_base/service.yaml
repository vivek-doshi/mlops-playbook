# _base/service.yaml
# Base Kubernetes Service for ML model serving.

apiVersion: v1
kind: Service
metadata:
  name: model-serving
  labels:
    app: model-serving
    component: serving
spec:
  selector:
    app: model-serving
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
