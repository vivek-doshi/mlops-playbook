# monitoring/alerts/ml-cost-alerts.yaml  →  finops/alerts/ml-cost-alerts.yaml
#
# Prometheus alerting rules for ML compute cost governance.
# These rules fire based on cost estimation metrics exported by the
# cost-attribution exporter (or derived from Kubernetes resource metrics).
#
# BEGINNER NOTE:
#   These alerts assume a custom Prometheus exporter exposes:
#   - ml_pod_cost_hourly_usd{model_name, environment, cost_center, team}
#   - ml_weekly_cost_usd{model_name}            (from weekly report job)
#   - ml_monthly_cost_usd{model_name}           (from monthly report job)
#   - ml_budget_weekly_limit_usd{model_name}    (from budget config)
#   - ml_budget_monthly_limit_usd{model_name}   (from budget config)

groups:
  - name: ml_cost_alerts
    interval: 15m
    rules:

      # -------------------------------------------------------------------
      # Weekly cost exceeds 80% of budget limit
      # -------------------------------------------------------------------
      - alert: MLWeeklyCostApproachingLimit
        expr: |
          ml_weekly_cost_usd
            / ml_budget_weekly_limit_usd > 0.80
        for: 1h
        labels:
          severity: warning
          team: "{{ $labels.team }}"
          playbook: "docs/golden-paths/ml-cost-attribution.md"
        annotations:
          summary: >-
            {{ $labels.model_name }} weekly cost is at
            {{ $value | humanizePercentage }} of the weekly limit.
          description: >-
            Model {{ $labels.model_name }} has consumed
            {{ $value | humanizePercentage }} of its weekly budget.
            Review recent training runs and consider spot node usage.

      # -------------------------------------------------------------------
      # Weekly cost exceeds 100% of budget limit (critical)
      # -------------------------------------------------------------------
      - alert: MLWeeklyCostExceedsLimit
        expr: |
          ml_weekly_cost_usd
            / ml_budget_weekly_limit_usd > 1.0
        for: 30m
        labels:
          severity: critical
          team: "{{ $labels.team }}"
          playbook: "docs/golden-paths/ml-cost-attribution.md"
        annotations:
          summary: >-
            {{ $labels.model_name }} weekly cost EXCEEDS the weekly limit.
          description: >-
            Model {{ $labels.model_name }} has exceeded its weekly budget limit.
            Deployments to production are blocked until the budget is reviewed.
            See finops/budgets/{{ $labels.model_name }}.yaml.

      # -------------------------------------------------------------------
      # Monthly cost exceeds 80% of budget limit
      # -------------------------------------------------------------------
      - alert: MLMonthlyCostApproachingLimit
        expr: |
          ml_monthly_cost_usd
            / ml_budget_monthly_limit_usd > 0.80
        for: 2h
        labels:
          severity: warning
          team: "{{ $labels.team }}"
          playbook: "docs/golden-paths/ml-cost-attribution.md"
        annotations:
          summary: >-
            {{ $labels.model_name }} monthly cost is at
            {{ $value | humanizePercentage }} of the monthly limit.
          description: >-
            Model {{ $labels.model_name }} has consumed
            {{ $value | humanizePercentage }} of its monthly budget.

      # -------------------------------------------------------------------
      # Pod missing required cost labels (untagged spend)
      # -------------------------------------------------------------------
      - alert: MLPodMissingCostLabels
        expr: |
          ml_pod_missing_cost_labels_count > 0
        for: 30m
        labels:
          severity: warning
          team: ml-platform
        annotations:
          summary: >-
            {{ $value }} pod(s) are missing required cost labels.
          description: >-
            Pods without cost-center, team, model-name, or environment labels
            cannot be attributed to a cost centre. Run ml-cost-attribution.py
            to identify them.

      # -------------------------------------------------------------------
      # GPU utilisation below 30% for > 2 hours (wasted GPU spend)
      # -------------------------------------------------------------------
      - alert: MLGPULowUtilisation
        expr: |
          avg_over_time(
            DCGM_FI_DEV_GPU_UTIL{namespace=~".*-(dev|staging|prod)"}[30m]
          ) < 30
        for: 2h
        labels:
          severity: warning
          team: ml-platform
          playbook: "docs/guides/gpu-cost-governance.md"
        annotations:
          summary: >-
            GPU in {{ $labels.namespace }} has low utilisation
            ({{ $value | humanize }}%) for > 2 hours.
          description: >-
            A GPU node in namespace {{ $labels.namespace }} is running below
            30% utilisation. Consider scaling down or switching to spot nodes
            to reduce wasted GPU spend.
