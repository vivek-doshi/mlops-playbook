version: "3.9"

# ============================================================================
# MLflow Tracking Server — Docker Compose Stack
# ============================================================================
# Services:
#   postgres  — metadata backend (runs, params, metrics, tags)
#   minio     — S3-compatible artifact store (model binaries, plots)
#   mlflow    — MLflow server (UI + REST API + artifact proxy)
#
# SECURITY NOTE:
#   All secrets are read from environment variables, not hardcoded here.
#   Copy `.env.example` to `.env` and fill in values before starting.
#   Never commit `.env` to version control.
#
# BEGINNER NOTE:
#   Run `docker compose up -d` to start all services in the background.
#   Run `docker compose logs -f mlflow` to tail the MLflow server logs.
#   MLflow UI will be available at http://localhost:5000

services:
  postgres:
    image: postgres:15
    container_name: mlflow-postgres
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Restart policy: restart unless explicitly stopped (handles host reboots).
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: mlflow-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.2
    container_name: mlflow-server
    depends_on:
      - postgres
      - minio
    environment:
      AWS_ACCESS_KEY_ID:     ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000

      # ------------------------------------------------------------------
      # AUTHENTICATION (MLflow Basic Auth)
      # ------------------------------------------------------------------
      # When MLFLOW_AUTH_CONFIG_PATH is set, MLflow enables the built-in
      # authentication plugin that requires a username/password for all API
      # calls and UI access.
      #
      # The config file at this path must contain:
      #   [mlflow]
      #   default_permission = READ
      #   database_uri = sqlite:////mlflow/auth/auth.db
      #   admin_username = admin
      #   admin_password = <hashed-password>
      #
      # Generate a hashed password:
      #   python -c "from mlflow.server.auth import store; print(store._hash_password('my-password'))"
      #
      # See: https://mlflow.org/docs/latest/auth/index.html
      MLFLOW_AUTH_CONFIG_PATH: /mlflow/auth/basic_auth.ini

    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      --artifacts-destination s3://mlflow
      --serve-artifacts
      --app-name basic-auth
    ports:
      - "5000:5000"
    # Mount the auth config directory so the container can read the INI file.
    volumes:
      - mlflow_auth:/mlflow/auth
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  # Named volume for MLflow authentication config and SQLite auth database.
  # On first start, copy your basic_auth.ini into this volume:
  #   docker run --rm -v mlops-playbook_mlflow_auth:/mlflow/auth \
  #     -v $(pwd)/mlflow/auth:/src alpine cp /src/basic_auth.ini /mlflow/auth/
  mlflow_auth:

