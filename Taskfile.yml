# Taskfile.yml — MLOps Playbook task runner (Taskfile v3)
#
# Taskfile is a modern, cross-platform task runner with a clean YAML syntax.
# It works on Windows (PowerShell), macOS, and Linux without needing `make`.
#
# INSTALL:
#   # macOS / Linux
#   sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
#   # Windows (Scoop)
#   scoop install task
#   # Windows (Chocolatey)
#   choco install go-task
#
# USAGE:
#   task                   # Show all available tasks
#   task setup             # Install Python dependencies
#   task mlflow:up         # Start MLflow stack
#   task train             # Run DVC training pipeline
#   task drift-check       # Run Evidently drift report
#
# BEGINNER NOTE:
#   Taskfile is a drop-in alternative to Makefile that works natively on Windows
#   without WSL or MinGW. Each `task` block is equivalent to a Makefile target.

version: "3"

# ──────────────────────────────────────────────────────────────────────────────
# Global variables — override at runtime: task drift-check DRIFT_THRESHOLD=0.6
# ──────────────────────────────────────────────────────────────────────────────
vars:
  MLFLOW_DIR: mlflow/tracking-server
  DVC_REMOTE: '{{.DVC_REMOTE | default "s3"}}'
  REFERENCE_DATA: '{{.REFERENCE_DATA | default "data/reference/train_features.parquet"}}'
  CURRENT_DATA: '{{.CURRENT_DATA | default "data/current/today_features.parquet"}}'
  DRIFT_REPORT: '{{.DRIFT_REPORT | default "reports/drift_report.html"}}'
  DRIFT_THRESHOLD: '{{.DRIFT_THRESHOLD | default "0.3"}}'
  PYTHON: python

# ──────────────────────────────────────────────────────────────────────────────
# Setup
# ──────────────────────────────────────────────────────────────────────────────
tasks:
  default:
    desc: Show all available tasks
    cmds:
      - task --list

  setup:
    desc: Install core Python dependencies (mlflow, dvc, evidently, fairlearn, shap, feast)
    cmds:
      - pip install --upgrade pip
      - pip install
          mlflow==2.14.2
          "dvc[s3,gcs,azure]>=3.0"
          "evidently>=0.4"
          pandas
          scikit-learn
          pyarrow
          "fairlearn>=0.10"
          "shap>=0.44"
          "matplotlib>=3.8"
          feast
          "pyyaml>=6.0"
          "requests>=2.31"

  setup:dev:
    desc: Install dev tooling + pre-commit hooks on top of core deps
    deps: [setup]
    cmds:
      - pip install pre-commit black isort ruff bandit detect-secrets pytest pytest-cov
      - pre-commit install
      - pre-commit install --hook-type commit-msg
      - task: secrets-baseline

  secrets-baseline:
    desc: Generate initial detect-secrets baseline file (run once after setup:dev)
    cmds:
      - detect-secrets scan
          --exclude-files "\.lock$"
          --exclude-files "dvc/remote-storage/.*\.sample$"
          > .secrets.baseline
    generates:
      - .secrets.baseline

  # ──────────────────────────────────────────────────────────────────────────
  # MLflow Tracking Stack
  # ──────────────────────────────────────────────────────────────────────────
  mlflow:up:
    desc: Start MLflow tracking stack (PostgreSQL + MinIO + MLflow v2.14.2)
    dir: "{{.MLFLOW_DIR}}"
    preconditions:
      - sh: test -f .env
        msg: "Copy .env.example to {{.MLFLOW_DIR}}/.env and fill in secrets first."
    cmds:
      - docker compose up -d
      - echo "MLflow UI  → http://localhost:5000"
      - echo "MinIO UI   → http://localhost:9001"

  mlflow:down:
    desc: Stop and remove MLflow stack containers
    dir: "{{.MLFLOW_DIR}}"
    cmds:
      - docker compose down

  mlflow:logs:
    desc: Tail MLflow server logs (Ctrl+C to stop)
    dir: "{{.MLFLOW_DIR}}"
    cmds:
      - docker compose logs -f mlflow

  mlflow:ps:
    desc: Show running MLflow stack container status
    dir: "{{.MLFLOW_DIR}}"
    cmds:
      - docker compose ps

  mlflow:reset:
    desc: "DESTRUCTIVE: Remove all MLflow volumes (wipes experiments, runs, artifacts)"
    prompt: "This will delete all MLflow data. Are you sure?"
    dir: "{{.MLFLOW_DIR}}"
    cmds:
      - docker compose down -v

  # ──────────────────────────────────────────────────────────────────────────
  # DVC — Data Versioning
  # ──────────────────────────────────────────────────────────────────────────
  dvc:pull:
    desc: "Pull dataset and artifacts from DVC remote (default: {{.DVC_REMOTE}})"
    cmds:
      - dvc pull --remote {{.DVC_REMOTE}}

  dvc:push:
    desc: Push new dataset versions and artifacts to DVC remote
    cmds:
      - dvc push --remote {{.DVC_REMOTE}}

  dvc:status:
    desc: Show which DVC-tracked files differ from the remote
    cmds:
      - dvc status --remote {{.DVC_REMOTE}}

  dvc:repro:
    desc: Reproduce the full DVC pipeline (train → evaluate → deploy-candidate)
    cmds:
      - dvc repro

  # ──────────────────────────────────────────────────────────────────────────
  # ML Pipeline
  # ──────────────────────────────────────────────────────────────────────────
  train:
    desc: Pull data from DVC remote then reproduce the training pipeline
    deps: [dvc:pull]
    cmds:
      - dvc repro train
      - echo "✓ Training complete. Check MLflow UI at http://localhost:5000"

  evaluate:
    desc: Run standalone model evaluation (requires MLFLOW_RUN_ID env var)
    preconditions:
      - sh: test -n "$MLFLOW_RUN_ID"
        msg: "Set the MLFLOW_RUN_ID environment variable before running evaluate."
    cmds:
      - "{{.PYTHON}} pipelines/evaluate.py --run-id $MLFLOW_RUN_ID"

  drift-check:
    desc: Run Evidently drift report against current production data
    cmds:
      - mkdir -p reports
      - "{{.PYTHON}} monitoring/evidently/drift_report.py
          --reference {{.REFERENCE_DATA}}
          --current   {{.CURRENT_DATA}}
          --output    {{.DRIFT_REPORT}}
          --threshold {{.DRIFT_THRESHOLD}}"
      - echo "✓ Drift report written to {{.DRIFT_REPORT}}"

  fairness:eval:
    desc: Run fairlearn fairness evaluation (requires MLFLOW_RUN_ID, MODEL_NAME, MODEL_VERSION, TEST_DATA)
    preconditions:
      - sh: test -n "$MLFLOW_RUN_ID"
        msg: "Set the MLFLOW_RUN_ID environment variable before running fairness:eval."
    cmds:
      - mkdir -p reports/fairness
      - "{{.PYTHON}} -m fairness.evaluate
          --model-uri models:/$MODEL_NAME/$MODEL_VERSION
          --test-data $TEST_DATA
          --config    policy/fairness/fraud-detection-fairness.yaml
          --report-path reports/fairness/fairness_report.json"
      - echo "✓ Fairness report written to reports/fairness/fairness_report.json"

  fairness:check:
    desc: Run fairness evaluation locally (requires MLFLOW_RUN_ID, MODEL_NAME, MODEL_VERSION, TEST_DATA)
    preconditions:
      - sh: test -n "$MLFLOW_RUN_ID"
        msg: "Set the MLFLOW_RUN_ID environment variable before running fairness:check."
      - sh: test -n "$MODEL_VERSION"
        msg: "Set the MODEL_VERSION environment variable before running fairness:check."
    cmds:
      - mkdir -p reports/fairness
      - "{{.PYTHON}} -m fairness.evaluate
          --model-uri models:/$MODEL_NAME/$MODEL_VERSION
          --test-data $TEST_DATA
          --config    policy/fairness/fraud-detection-fairness.yaml
          --report-path reports/fairness/fairness_report.json"
      - echo "✓ Fairness report written to reports/fairness/fairness_report.json"

  distributed:train:
    desc: Submit a distributed Ray training job (requires CONFIG and FRAMEWORK env vars)
    preconditions:
      - sh: test -n "$CONFIG"
        msg: "Set CONFIG (e.g. training/config/fraud-detection.yaml)."
      - sh: test -n "$FRAMEWORK"
        msg: "Set FRAMEWORK (e.g. pytorch or sklearn)."
    cmds:
      - ray job submit --working-dir .
          -- {{.PYTHON}} training/ray/train_distributed.py --config $CONFIG
      - echo "✓ Distributed training job submitted. Check Ray dashboard for status."

  batch:run:
    desc: Run a one-shot batch inference job locally (requires JOB_CONFIG)
    preconditions:
      - sh: test -n "$JOB_CONFIG"
        msg: "Set JOB_CONFIG (e.g. batch/jobs/fraud-detection-batch-job.yaml)."
    cmds:
      - "{{.PYTHON}} batch/runner/batch_scorer.py --job-config $JOB_CONFIG"
      - echo "✓ Batch inference job complete."

  batch:validate:
    desc: Validate batch job config YAML against schema (requires JOB_CONFIG)
    preconditions:
      - sh: test -n "$JOB_CONFIG"
        msg: "Set JOB_CONFIG to the batch job YAML to validate."
    cmds:
      - "{{.PYTHON}} batch/runner/input_validator.py --schema batch/jobs/_job-schema.yaml --job-config $JOB_CONFIG"
      - echo "✓ Batch job config is valid."

  finops:daily:
    desc: Run daily cost attribution
    cmds:
      - mkdir -p reports/finops/daily
      - "{{.PYTHON}} finops/scripts/ml-cost-attribution.py
          --rates-file  finops/data/instance-rates.yaml
          --output-path reports/finops/daily/cost-attribution.json
          --lookback-hours 24"
      - echo "✓ Daily cost attribution written to reports/finops/daily/cost-attribution.json"

  finops:weekly:
    desc: Generate weekly cost report
    cmds:
      - mkdir -p reports/finops
      - "{{.PYTHON}} finops/scripts/weekly-cost-report.py --output reports/finops/weekly-cost-report.json"
      - echo "✓ Weekly cost report written to reports/finops/weekly-cost-report.json"

  finops:monthly:
    desc: Generate monthly chargeback report
    cmds:
      - mkdir -p reports/finops/monthly
      - "{{.PYTHON}} finops/scripts/monthly-cost-report.py
          --reports-dir finops/reports/daily/
          --output-dir  reports/finops/monthly/
          --budget-dir  finops/budgets/"
      - echo "✓ Monthly chargeback report written to reports/finops/monthly/"


    desc: Run batch inference scorer (requires BATCH_JOB_CONFIG)
    preconditions:
      - sh: test -n "$BATCH_JOB_CONFIG"
        msg: "Set BATCH_JOB_CONFIG (e.g. batch/jobs/fraud-detection-batch-job.yaml)."
    cmds:
      - "{{.PYTHON}} batch/runner/batch_scorer.py --job-config $BATCH_JOB_CONFIG"
      - echo "✓ Batch scoring complete."

  finops:report:
    desc: Generate weekly ML cost report
    cmds:
      - mkdir -p reports/finops
      - "{{.PYTHON}} finops/scripts/weekly-cost-report.py --output reports/finops/weekly-cost-report.json"
      - echo "✓ FinOps report written to reports/finops/weekly-cost-report.json"

  # ──────────────────────────────────────────────────────────────────────────
  # Code Quality
  # ──────────────────────────────────────────────────────────────────────────
  format:
    desc: Auto-format Python source files with Black + isort
    cmds:
      - black batch/ fairness/ finops/scripts/ monitoring/ pipelines/ scripts/
      - isort --profile black batch/ fairness/ finops/scripts/ monitoring/ pipelines/ scripts/

  lint:
    desc: Lint Python source files with Ruff (fast flake8 replacement)
    cmds:
      - ruff check batch/ fairness/ finops/scripts/ monitoring/ pipelines/ scripts/

  security:bandit:
    desc: Run Bandit security scan on Python source files
    cmds:
      - bandit -r batch/ fairness/ finops/scripts/ monitoring/ pipelines/ scripts/ --severity-level medium

  security:pip-audit:
    desc: Audit Python dependencies for known CVEs
    cmds:
      - pip-audit --format columns

  security:
    desc: Run full security scan (Bandit + pip-audit + detect-secrets)
    deps: [security:bandit, security:pip-audit]
    cmds:
      - detect-secrets scan --baseline .secrets.baseline

  pre-commit:
    desc: Run all pre-commit hooks against all staged files
    cmds:
      - pre-commit run

  pre-commit:all:
    desc: Run all pre-commit hooks against ALL files in the repo
    cmds:
      - pre-commit run --all-files

  # ──────────────────────────────────────────────────────────────────────────
  # Terraform
  # ──────────────────────────────────────────────────────────────────────────
  tf:fmt:
    desc: Format all Terraform files recursively
    cmds:
      - terraform fmt -recursive terraform/

  tf:validate:sagemaker:
    desc: Validate AWS SageMaker Terraform module syntax
    dir: terraform/aws-sagemaker
    cmds:
      - terraform init -backend=false
      - terraform validate

  tf:validate:vertex:
    desc: Validate GCP Vertex AI Terraform module syntax
    dir: terraform/gcp-vertex-ai
    cmds:
      - terraform init -backend=false
      - terraform validate

  tf:validate:azure-ml:
    desc: Validate Azure ML Terraform module syntax
    dir: terraform/azure-ml
    cmds:
      - terraform init -backend=false
      - terraform validate

  tf:validate:ray-cluster:
    desc: Validate Ray cluster Terraform module syntax
    dir: terraform/ray-cluster
    cmds:
      - terraform init -backend=false
      - terraform validate

  tf:validate:vertex-pipelines:
    desc: Validate Vertex Pipelines Terraform module syntax
    dir: terraform/vertex-pipelines
    cmds:
      - terraform init -backend=false
      - terraform validate

  tf:validate:
    desc: Validate all Terraform modules
    deps:
      - tf:fmt
      - tf:validate:sagemaker
      - tf:validate:vertex
      - tf:validate:azure-ml
      - tf:validate:ray-cluster
      - tf:validate:vertex-pipelines

  tf:validate:azure:
    desc: Validate Azure ML Terraform module syntax (alias for tf:validate:azure-ml)
    deps: [tf:validate:azure-ml]

  tf:plan:azure:
    desc: Plan Azure ML Terraform changes (requires Azure creds)
    dir: terraform/azure-ml
    cmds:
      - terraform plan

  # ──────────────────────────────────────────────────────────────────────────
  # Model Promotion and Rollback
  # ──────────────────────────────────────────────────────────────────────────
  promote:dev:
    desc: Trigger dev promotion workflow via gh CLI (requires MODEL_NAME and MODEL_VERSION)
    preconditions:
      - sh: test -n "$MODEL_NAME"
        msg: "Set MODEL_NAME before promoting."
      - sh: test -n "$MODEL_VERSION"
        msg: "Set MODEL_VERSION before promoting."
    cmds:
      - gh workflow run promote-dev.yml
          --field model_name=$MODEL_NAME
          --field model_version=$MODEL_VERSION
      - echo "✓ Dev promotion workflow triggered for $MODEL_NAME v$MODEL_VERSION."

  promote:staging:
    desc: Trigger staging promotion workflow via gh CLI (requires MODEL_NAME and MODEL_VERSION)
    preconditions:
      - sh: test -n "$MODEL_NAME"
        msg: "Set MODEL_NAME before promoting."
      - sh: test -n "$MODEL_VERSION"
        msg: "Set MODEL_VERSION before promoting."
    cmds:
      - gh workflow run promote-staging.yml
          --field model_name=$MODEL_NAME
          --field model_version=$MODEL_VERSION
      - echo "✓ Staging promotion workflow triggered for $MODEL_NAME v$MODEL_VERSION."

  rollback:
    desc: Trigger rollback workflow (requires MODEL_NAME, ENV, and REASON)
    preconditions:
      - sh: test -n "$MODEL_NAME"
        msg: "Set MODEL_NAME before rolling back."
      - sh: test -n "$ENV"
        msg: "Set ENV (dev|staging|production) before rolling back."
      - sh: test -n "$REASON"
        msg: "Set REASON for the rollback."
    cmds:
      - gh workflow run rollback.yml
          --field model_name=$MODEL_NAME
          --field environment=$ENV
          --field reason="$REASON"
      - echo "✓ Rollback workflow triggered for $MODEL_NAME in $ENV."

  # ──────────────────────────────────────────────────────────────────────────
  # Model Cards
  # ──────────────────────────────────────────────────────────────────────────
  generate-model-card:
    desc: Generate a model card (requires MODEL_NAME and MODEL_VERSION)
    preconditions:
      - sh: test -n "$MODEL_NAME"
        msg: "Set MODEL_NAME before generating model card."
      - sh: test -n "$MODEL_VERSION"
        msg: "Set MODEL_VERSION before generating model card."
    cmds:
      - "{{.PYTHON}} scripts/generate_model_card.py
          --model-name    $MODEL_NAME
          --model-version $MODEL_VERSION
          --output-dir    docs/model-cards/"
      - echo "✓ Model card written to docs/model-cards/$MODEL_NAME/v$MODEL_VERSION.md"


  repo-map:
    desc: Regenerate .ai/context/repo_map.md using the repo map generator script
    platforms: [windows]
    cmds:
      - powershell -File scripts/generate-repo-map.ps1

  clean:
    desc: Remove generated reports, __pycache__, and cache directories
    cmds:
      - find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
      - find . -type d -name .pytest_cache -exec rm -rf {} + 2>/dev/null || true
      - find . -type d -name .ruff_cache -exec rm -rf {} + 2>/dev/null || true
      - rm -rf reports/
      - echo "✓ Clean complete."
